version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Wishlist.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_CONNECTION: Host=db;Port=5432;Database=wishlist;Username=postgres;Password=postgres
      JWT_ISSUER: MyWishlist
      JWT_AUDIENCE: MyWishlistAudience
      JWT_KEY: super-secret-development-key-please-change
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
